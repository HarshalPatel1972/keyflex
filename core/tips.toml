# Keyflex tips.
#
# Each [[tip]] is one "there is a better way" moment:
#   id          unique, stable name (tip history is stored under it)
#   apps        exe names the tip applies to, lowercase; ["*"] means every app
#   shortcut    the better way; pressing it counts as "the user knows this"
#   topic       what the tip is about, as it reads mid-sentence ("Downloads",
#               "renaming"); used when celebrating: "I'll never bring up ... again"
#   within_secs for multi-step tips, how long the whole sequence may take (default 120)
#   lines       what we say. A tip is shown at most three times and the lines
#               escalate with the character's face:
#                 1st  a friendly "psst"              (wink)
#                 2nd  cheeky, "we talked about this" (half-closed eyes)
#                 3rd  a dramatic last plea            (big wet eyes)
#   [[tip.step]] what the user has to do, in order, for the tip to fire.
#               `any` lists alternatives; each alternative is exactly one of
#                 is     = "copy"         a button/menu item named exactly this
#                 click  = "name prefix"  a button/menu item whose name starts with this
#                 key    = "Delete"       a key or combo
#                 opened = true           a new window of the app, opened using only the mouse
#               (names are compared without case, "&", "..." or a trailing shortcut)
#               optionally narrowed by
#                 types = ["MenuItem"]    Button | MenuItem | SplitButton
#                 while_typing = true     only if the user was typing just before
#                 window = "text"         active window title contains this
#                 window_not = "text"     active window title does not contain this
#                 class = "CabinetWClass" with `opened`: only this kind of window
#
# Only add a tip when the shortcut is a real improvement:
#   * something reached through a menu (two or more clicks) always qualifies;
#   * a one-click toolbar button qualifies only `while_typing`, when reaching
#     for the mouse was the detour;
#   * opening an app by hunting for it with the mouse qualifies.
# Every line is written by hand.

# ── Everywhere ───────────────────────────────────────────────────────────
# The classics, when reached through a right-click or an Edit menu.

[[tip]]
id = "everywhere.copy"
apps = ["*"]
shortcut = "Ctrl+C"
topic = "copying"
lines = [
  "Right-click, then Copy? Ctrl+C does it before the menu finishes opening.",
  "The right-click menu again. Ctrl+C is two keys and zero menus. Just saying.",
  "Last time, I promise: Ctrl+C copies. It has since 1983. It's very reliable.",
]
[[tip.step]]
any = [{ is = "copy", types = ["MenuItem"] }]

